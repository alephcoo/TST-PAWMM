server {
    listen 80;
    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Healthcheck gateway
    location = /api/health {
        default_type application/json;
        return 200 '{"service":"batasku-gateway","status":"ok"}';
    }

    # Alias ramah -> koleksi PocketBase (mendukung /alias dan /alias/<id>)
    location ~ ^/api/auth(/.*)?$ {
        rewrite ^/api/auth(/.*)?$ /api/collections/users$1 break;
        proxy_pass http://core-service:8090;
    }
    location ~ ^/api/profiles(/.*)?$ {
        rewrite ^/api/profiles(/.*)?$ /api/collections/profiles/records$1 break;
        proxy_pass http://core-service:8090;
    }
    location ~ ^/api/limits(/.*)?$ {
        rewrite ^/api/limits(/.*)?$ /api/collections/daily_limits/records$1 break;
        proxy_pass http://core-service:8090;
    }
    location ~ ^/api/foods(/.*)?$ {
        rewrite ^/api/foods(/.*)?$ /api/collections/foods/records$1 break;
        proxy_pass http://core-service:8090;
    }
    location ~ ^/api/intakes(/.*)?$ {
        rewrite ^/api/intakes(/.*)?$ /api/collections/intakes/records$1 break;
        proxy_pass http://core-service:8090;
    }

    # Hook kustom (summary, dll) dan API PocketBase lain (/api/collections/...)
    location /api/ {
        proxy_pass http://core-service:8090;
    }

    # Admin UI PocketBase
    location /_/ {
        proxy_pass http://core-service:8090;
    }
}
